name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd overlay)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Linux CLI and lab controller
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -o dist/xconnect-linux-${{ matrix.arch }} ./cmd/xconnect
          go build -trimpath -o dist/xconnect-zero-lab-linux-${{ matrix.arch }} ./cmd/xconnect-zero-lab
      - uses: actions/upload-artifact@v4
        with:
          name: xconnect-release-linux-${{ matrix.arch }}
          path: |
            dist/xconnect-linux-${{ matrix.arch }}
            dist/xconnect-zero-lab-linux-${{ matrix.arch }}

  build-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build macOS controlled-client CLI
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -o dist/xconnect-macos-${{ matrix.arch }} ./cmd/xconnect
      - uses: actions/upload-artifact@v4
        with:
          name: xconnect-release-macos-${{ matrix.arch }}
          path: dist/xconnect-macos-${{ matrix.arch }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xconnect-release-*
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "XConnect-One ${GITHUB_REF_NAME}" --generate-notes
